name: Test PHP 8.5 CALL VM with JIT

on:
  push:
    paths: [.github/workflows/test-php85-call-vm.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  # Includes upstream fixes for the IMAP stubs in PHP 8.4.27/8.5.12 and current Swoole.
  SPC_REF: 84ff669ee513609bc75aa43a87e2f3a349b37109
  SPC_EXTRA_PHP_VARS: php_cv_preserve_none=no
  EXTENSIONS: apcu,bcmath,bz2,calendar,ctype,curl,dba,dom,event,exif,fileinfo,filter,ftp,gd,gmp,iconv,imagick,imap,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pgsql,phar,posix,protobuf,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,swoole,swoole-hook-mysql,swoole-hook-pgsql,swoole-hook-sqlite,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib,amqp,gettext,igbinary,mongodb,msgpack,xlswriter

jobs:
  build:
    name: PHP ${{ matrix.php.version }} / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SPC_TARGET: x86_64-linux-musl
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: {branch: '8.5', version: '8.5.12', sha256: '81a0f450349e84b08eb43faa85f8a4c835684f3cc1c50471775d1317a046c525'}, profile: stdext-off, jit: 'yes'}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          ref: ${{ env.SPC_REF }}
      - uses: actions/checkout@v4
        with:
          path: .release-tools
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: curl,openssl,mbstring
          ini-values: memory_limit=-1
      - name: Apply maintained candidate compiler profile
        run: python3 .release-tools/.github/jit/apply_spc_profile.py --profile '${{ matrix.profile }}'
      - name: Validate compiler changes
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          bin/spc dev:lint-config
          composer cs-fix -- --dry-run --diff
          composer test
          composer analyse
          bin/spc doctor --auto-fix
      - uses: actions/cache@v4
        with:
          path: downloads/
          key: security-sources-${{ env.SPC_REF }}-${{ matrix.php.version }}-linux-x86_64
      - name: Download pinned sources
        run: |
          bin/spc download \
            --with-php=${{ matrix.php.version }} \
            --custom-url=php-src:https://www.php.net/distributions/php-${{ matrix.php.version }}.tar.gz \
            --custom-url=ext-swoole:https://github.com/swoole/swoole-src/archive/refs/tags/v6.2.3.tar.gz \
            --custom-url=libevent:https://github.com/libevent/libevent/releases/download/release-2.1.13-stable/libevent-2.1.13-stable.tar.gz \
            --custom-url=ext-event:https://bitbucket.org/osmanov/pecl-event/get/3.1.6.tar.gz \
            --for-extensions="$EXTENSIONS" --retry=5 --parallel=4
          bin/spc download --for-packages=llvm-compiler-rt --retry=5
          echo '${{ matrix.php.sha256 }}  downloads/php-${{ matrix.php.version }}.tar.gz' | sha256sum -c -
          echo 'f7e9383b8c0baa81b687e5b5eecc01beefaf1b19b64151d95ed61647fe7a315c  downloads/libevent-2.1.13-stable.tar.gz' | sha256sum -c -
          echo '4ac43b6ba60d762f530e941fb406e66cc17a089401c7f9a58b048a780edba44b  downloads/3.1.6.tar.gz' | sha256sum -c -
          python3 - <<'PYCODE'
          import hashlib
          from pathlib import Path
          expected = 'dde8d2a4a6b5c5cd418aedd8561760baad59767a2f8a963b2c0e9eb9c86f4c8d'
          matches = [p for p in Path('downloads').iterdir() if p.is_file() and '6.2.3' in p.name and hashlib.sha256(p.read_bytes()).hexdigest() == expected]
          assert len(matches) == 1, 'Pinned Swoole source checksum mismatch'
          print('Verified Swoole source:', matches[0])
          PYCODE
      - name: Build full production extension profile with CLI and micro
        run: bin/spc build:php "$EXTENSIONS" --build-cli --build-micro --no-download --dl-with-php=${{ matrix.php.version }}
      - name: Test unpacked JIT and coroutine behavior
        run: python3 .release-tools/.github/jit/run_checks.py --php "$PWD/buildroot/bin/php" --expect-jit '${{ matrix.jit }}' --output validation/jit-unpacked.json
      - name: Retest the original PHP 8.5 crash reproducer
        run: python3 .release-tools/.github/jit/run_checks.py --php "$PWD/buildroot/bin/php" --fixture .release-tools/.github/jit/repro-php85-jit.php --jit-modes tracing --expect-jit yes --output validation/jit-original-repro.json
      - name: Check size and pack with production UPX profile
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php.version }}
          TARGET_ARCH: x86_64
          TARGET_SUFFIX: ''
        run: |
          python3 .release-tools/.github/scripts/verify-lean-build.py
          python3 .release-tools/.github/scripts/pack-php-upx.py
      - name: Test packed JIT and coroutine behavior
        run: python3 .release-tools/.github/jit/run_checks.py --php "$PWD/buildroot/bin/php" --expect-jit '${{ matrix.jit }}' --output validation/jit-upx.json
      - name: Test micro production defaults
        run: python3 .release-tools/.github/jit/run_micro_checks.py --micro buildroot/bin/micro.sfx --output validation/micro-defaults.json
      - name: Test real packaged webman HTTP server
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php.version }}
        run: python3 .release-tools/.github/scripts/smoke-webman-bin.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jit-candidate-${{ matrix.php.branch }}-${{ matrix.profile }}
          path: |
            validation/
            buildroot/bin/php
            buildroot/bin/micro.sfx
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jit-build-logs-${{ matrix.php.branch }}-${{ matrix.profile }}
          path: log/
          retention-days: 3

  wsl:
    name: Test PHP 8.5 CALL VM on real WSL2
    needs: build
    runs-on: windows-2025
    steps:
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: jit-candidate-8.5-stdext-off
          path: candidate
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-24.04
          wsl-version: '2'
          additional-packages: python3
      - name: Test actual JIT, original reproducer and micro on WSL2
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          uname -a
          grep -qi microsoft /proc/version
          grep -qi wsl2 /proc/sys/kernel/osrelease
          chmod +x candidate/buildroot/bin/php
          python3 .github/jit/run_checks.py --php "$PWD/candidate/buildroot/bin/php" --expect-jit yes --output results/jit.json
          python3 .github/jit/run_checks.py --php "$PWD/candidate/buildroot/bin/php" --fixture .github/jit/repro-php85-jit.php --jit-modes tracing --expect-jit yes --output results/original-repro.json
          python3 .github/jit/run_micro_checks.py --micro candidate/buildroot/bin/micro.sfx --output results/micro-defaults.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jit-runtime-8.5-WSL2
          path: results/
          retention-days: 7
