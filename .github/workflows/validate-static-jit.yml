name: Validate static JIT on Linux and WSL2

on:
  workflow_run:
    workflows: [Test static PHP JIT candidates]
    types: [completed]
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Completed static candidate build run ID
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Verify and pack PHP ${{ matrix.php }} on Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source-run-id || github.event.workflow_run.id }}
          name: jit-candidate-${{ matrix.php }}-stdext-off
          path: candidate
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: curl,openssl,mbstring
      - name: Verify JIT with stdext disabled and original coroutine hooks
        shell: bash
        run: |
          chmod +x candidate/buildroot/bin/php
          python3 .github/jit/run_checks.py --php "$PWD/candidate/buildroot/bin/php" --expect-jit yes --output candidate/validation/jit-input.json
      - name: Pack raw control artifacts with the production UPX profile
        working-directory: candidate
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php }}
          TARGET_ARCH: x86_64
          TARGET_SUFFIX: ''
        shell: bash
        run: |
          export EXPECTED_PHP_VERSION="$(buildroot/bin/php -n -r 'echo PHP_VERSION;')"
          export EXTENSIONS="$(python3 -c 'import re; from pathlib import Path; print(re.search(r"^  EXTENSIONS: (.+)$", Path("../.github/workflows/build-php-unix.yml").read_text(), re.M)[1])')"
          if [[ ! -f validation/upx-pack.json ]]; then
            python3 ../.github/scripts/verify-lean-build.py
            python3 ../.github/scripts/pack-php-upx.py
          fi
      - name: Verify UPX CLI JIT and micro production defaults
        shell: bash
        run: |
          python3 .github/jit/run_checks.py --php "$PWD/candidate/buildroot/bin/php" --expect-jit yes --output candidate/validation/jit-final.json
          python3 .github/jit/run_micro_checks.py --micro candidate/buildroot/bin/micro.sfx --output candidate/validation/micro-defaults.json
      - name: Verify real packaged webman HTTP server
        working-directory: candidate
        shell: bash
        run: |
          export EXPECTED_PHP_VERSION="$(buildroot/bin/php -n -r 'echo PHP_VERSION;')"
          python3 ../.github/scripts/smoke-webman-bin.py
      - uses: actions/upload-artifact@v4
        with:
          name: jit-ready-${{ matrix.php }}
          path: candidate/
          retention-days: 7

  wsl:
    name: Verify PHP ${{ matrix.php }} on real WSL2
    needs: prepare
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: jit-ready-${{ matrix.php }}
          path: candidate
      - name: Setup real WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-24.04
          wsl-version: '2'
          additional-packages: python3
      - name: Verify CLI JIT and micro production defaults inside WSL2
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          uname -a
          grep -qi microsoft /proc/version
          grep -qi wsl2 /proc/sys/kernel/osrelease
          chmod +x candidate/buildroot/bin/php
          python3 .github/jit/run_checks.py --php "$PWD/candidate/buildroot/bin/php" --expect-jit yes --output results/cli.json
          python3 .github/jit/run_micro_checks.py --micro candidate/buildroot/bin/micro.sfx --output results/micro.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jit-runtime-${{ matrix.php }}-WSL2
          path: results/
          retention-days: 7
