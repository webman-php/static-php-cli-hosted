name: Build Self-Hosted PHP Binary (Unix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-php-unix-release
  cancel-in-progress: false

env:
  # Pin maintained SPC v2, including the August 2026 libaom patch fix.
  SPC_REF: 956fa13e7c390e3127cc0343215c00491f13a835
  EXTENSIONS: apcu,bcmath,bz2,calendar,ctype,curl,dba,dom,event,exif,fileinfo,filter,ftp,gd,gmp,iconv,imagick,imap,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pgsql,phar,posix,protobuf,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,swoole,swoole-hook-mysql,swoole-hook-pgsql,swoole-hook-sqlite,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib,amqp,gettext,igbinary,mongodb,msgpack,xlswriter

jobs:
  build-release-artifacts:
    name: PHP ${{ matrix.php.version }} / ${{ matrix.target.os }}-${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        php:
          - branch: '8.2'
            version: '8.2.35'
            sha256: 9db4204f0a2d1911277ae832185e07bb4c3b3559772753a70d2968ca346d6910
          - branch: '8.3'
            version: '8.3.36'
            sha256: c93f3441f87f6ab156bef4432db215d7e61ca2c0183bb3a2aa28d9886ab59f53
          - branch: '8.4'
            version: '8.4.27'
            sha256: 5bafed9994c1a49796b25b5f61c22c9183bfe046b6acc7b363842d03c77f972f
          - branch: '8.5'
            version: '8.5.12'
            sha256: 81a0f450349e84b08eb43faa85f8a4c835684f3cc1c50471775d1317a046c525
        target:
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
            command: bin/spc-alpine-docker
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            command: bin/spc-alpine-docker
          - runner: macos-15-intel
            os: macos
            arch: x86_64
            command: bin/spc
          - runner: macos-15
            os: macos
            arch: aarch64
            command: bin/spc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          ref: ${{ env.SPC_REF }}

      - name: Setup build runtime
        if: runner.os == 'macOS'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: curl,openssl,mbstring
          ini-values: memory_limit=-1

      - name: Install build dependencies
        if: runner.os == 'macOS'
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist
          bin/spc doctor --auto-fix

      # A full patch version and compiler commit prevent reuse of vulnerable sources.
      - uses: actions/cache@v4
        with:
          path: downloads/
          key: security-sources-${{ env.SPC_REF }}-${{ matrix.php.version }}-${{ matrix.target.os }}-${{ matrix.target.arch }}

      - name: Download fresh sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ${{ matrix.target.command }} download \
            --with-php=${{ matrix.php.version }} \
            --custom-url=php-src:https://www.php.net/distributions/php-${{ matrix.php.version }}.tar.gz \
            --for-extensions="$EXTENSIONS" --retry=5
          echo '${{ matrix.php.sha256 }}  downloads/php-${{ matrix.php.version }}.tar.gz' | shasum -a 256 -c -

      - name: Build CLI and micro
        run: ${{ matrix.target.command }} build "$EXTENSIONS" --build-cli --build-micro --debug

      - name: Verify and package
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          PHP_BIN=buildroot/bin/php
          "$PHP_BIN" -n -v
          test "$("$PHP_BIN" -n -r 'echo PHP_VERSION;')" = "$EXPECTED_PHP_VERSION"
          "$PHP_BIN" -n -r '
            foreach (["pcntl", "posix", "sockets", "openssl", "curl", "mbstring", "event", "redis", "apcu", "sodium", "intl", "gd", "imagick"] as $ext) {
                if (!extension_loaded($ext)) { fwrite(STDERR, "Missing extension: $ext\n"); exit(1); }
            }
            $server = stream_socket_server("tcp://127.0.0.1:0", $errno, $error);
            if (!$server) { throw new RuntimeException($error); }
            $client = stream_socket_client("tcp://" . stream_socket_get_name($server, false));
            $peer = stream_socket_accept($server, 5);
            fwrite($client, "workerman\n");
            if (fgets($peer) !== "workerman\n") { exit(1); }
            echo "Socket smoke test passed\n";
          '
          BASE=php-${{ matrix.php.branch }}-${{ matrix.target.os }}-${{ matrix.target.arch }}
          "$PHP_BIN" -n -m > "dist/$BASE.extensions.txt"
          "$PHP_BIN" -n -r 'echo json_encode(["php_version" => PHP_VERSION, "extensions" => get_loaded_extensions()], JSON_PRETTY_PRINT), PHP_EOL;' > "dist/$BASE.json"
          tar -czf "dist/$BASE.tar.gz" -C buildroot/bin php
          (cd dist && shasum -a 256 "$BASE.tar.gz" > "$BASE.tar.gz.sha256")
          # Keep old installer URLs working while macos is the canonical name.
          if [ '${{ matrix.target.os }}' = macos ]; then
            cp "dist/$BASE.tar.gz" "dist/php-${{ matrix.php.branch }}-mac-${{ matrix.target.arch }}.tar.gz"
          fi
          if [ '${{ matrix.target.os }}-${{ matrix.target.arch }}' = linux-x86_64 ]; then
            cp "$PHP_BIN" "dist/php${{ matrix.php.branch }}"
            (cd dist && zip "php${{ matrix.php.branch }}.zip" "php${{ matrix.php.branch }}")
            cp buildroot/bin/micro.sfx "dist/php${{ matrix.php.branch }}.micro.sfx"
            (cd dist && zip "php${{ matrix.php.branch }}.micro.sfx.zip" "php${{ matrix.php.branch }}.micro.sfx")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php.branch }}-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.php.branch }}-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: log/
          retention-days: 7

  deploy:
    name: Publish verified binaries
    needs: build-release-artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: php-*
          path: release/
          merge-multiple: true
      - name: Verify all archives
        run: |
          set -euo pipefail
          test "$(find release -name '*.json' | wc -l)" -eq 16
          cd release
          for checksum in *.tar.gz.sha256; do sha256sum -c "$checksum"; done
      - name: Deploy with backups
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SERVER_SECRET_KEY }}
          ARGS: '-rltDzvO --delay-updates --backup --backup-dir=../php-backups/run-${{ github.run_id }}'
          SOURCE: release/
          REMOTE_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          REMOTE_PORT: ${{ secrets.DEPLOY_SERVER_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_SERVER_USER }}
          TARGET: ${{ secrets.DEPLOY_SERVER_TARGET }}
