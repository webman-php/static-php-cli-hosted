name: Build Self-Hosted PHP Binary (Unix)

on:
  workflow_dispatch:
    inputs:
      include-glibc:
        description: Also build Linux glibc 2.17-compatible binaries
        type: boolean
        default: true
      validation-only:
        description: Validate PHP 8.3 Linux x86_64 only, without publishing
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: static-php-unix-no-intl-${{ inputs.validation-only && 'validation' || 'release' }}
  cancel-in-progress: false

env:
  # Includes upstream fixes for the IMAP stubs in PHP 8.4.27/8.5.12 and current Swoole.
  SPC_REF: 84ff669ee513609bc75aa43a87e2f3a349b37109
  EXTENSIONS: apcu,bcmath,bz2,calendar,ctype,curl,dba,dom,event,exif,fileinfo,filter,ftp,gd,gmp,iconv,imagick,imap,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,pcntl,pdo,pdo_mysql,pgsql,phar,posix,protobuf,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,swoole,swoole-hook-mysql,swoole-hook-pgsql,swoole-hook-sqlite,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib,amqp,gettext,igbinary,mongodb,msgpack,xlswriter

jobs:
  plan:
    name: Select build platforms
    runs-on: ubuntu-24.04
    outputs:
      php: ${{ steps.targets.outputs.php }}
      targets: ${{ steps.targets.outputs.targets }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        env:
          INCLUDE_GLIBC: ${{ inputs.include-glibc }}
          VALIDATION_ONLY: ${{ inputs.validation-only }}
        run: python3 .github/scripts/php_releases.py plan

  build-release-artifacts:
    name: PHP ${{ matrix.php.version }} / ${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.suffix }}
    needs: plan
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SPC_TARGET: ${{ matrix.target.triple }}
      # Keep JIT, using the traditional VM until PHP 8.5 TAILCALL hooks are compatible.
      SPC_EXTRA_PHP_VARS: ${{ matrix.php.branch == '8.5' && 'php_cv_preserve_none=no' || '' }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.plan.outputs.php) }}
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crazywhalecc/static-php-cli
          ref: ${{ env.SPC_REF }}

      - uses: actions/checkout@v4
        with:
          path: .release-tools
          persist-credentials: false

      - name: Disable experimental Swoole stdext for JIT compatibility
        run: python3 .release-tools/.github/jit/apply_spc_profile.py --profile stdext-off

      - name: Setup build runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: curl,openssl,mbstring
          ini-values: memory_limit=-1

      - name: Install build dependencies
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist
          bin/spc doctor --auto-fix
          bin/spc dev:lint-config

      # A full patch version and compiler commit prevent reuse of vulnerable sources.
      - uses: actions/cache@v4
        with:
          path: downloads/
          key: security-sources-${{ env.SPC_REF }}-${{ matrix.php.version }}-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.suffix }}

      - name: Download fresh sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bin/spc download \
            --with-php=${{ matrix.php.version }} \
            --custom-url=php-src:https://www.php.net/distributions/php-${{ matrix.php.version }}.tar.gz \
            --custom-url=libevent:https://github.com/libevent/libevent/releases/download/release-2.1.13-stable/libevent-2.1.13-stable.tar.gz \
            --custom-url=ext-event:https://bitbucket.org/osmanov/pecl-event/get/3.1.6.tar.gz \
            --for-extensions="$EXTENSIONS" --retry=5 --parallel=4
          # The target's Zig runtime is separate from the PHP extension dependencies.
          if [ '${{ matrix.target.os }}' = linux ]; then
            bin/spc download --for-packages=llvm-compiler-rt --retry=5
          fi
          echo 'f7e9383b8c0baa81b687e5b5eecc01beefaf1b19b64151d95ed61647fe7a315c  downloads/libevent-2.1.13-stable.tar.gz' | shasum -a 256 -c -
          echo '4ac43b6ba60d762f530e941fb406e66cc17a089401c7f9a58b048a780edba44b  downloads/3.1.6.tar.gz' | shasum -a 256 -c -
          echo '${{ matrix.php.sha256 }}  downloads/php-${{ matrix.php.version }}.tar.gz' | shasum -a 256 -c -

      - name: Build CLI and micro
        run: bin/spc build:php "$EXTENSIONS" --build-cli --build-micro --no-download --dl-with-php=${{ matrix.php.version }}

      - name: Verify actual JIT code generation and coroutine behavior
        run: python3 .release-tools/.github/jit/run_checks.py --php "$PWD/buildroot/bin/php" --expect-jit yes --output validation/jit-unpacked.json

      - name: Verify the PHP 8.5 VM regression reproducer
        if: matrix.php.branch == '8.5'
        run: python3 .release-tools/.github/jit/run_checks.py --php "$PWD/buildroot/bin/php" --fixture .release-tools/.github/jit/repro-php85-jit.php --jit-modes tracing --expect-jit yes --output validation/jit-original-repro.json

      - name: Verify unpacked binaries contain no intl, ICU or oversized payload
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php.version }}
          TARGET_SUFFIX: ${{ matrix.target.suffix }}
        run: python3 .release-tools/.github/scripts/verify-lean-build.py

      - name: Pack Linux CLI and micro with verified UPX
        if: matrix.target.os == 'linux'
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php.version }}
          TARGET_ARCH: ${{ matrix.target.arch }}
          TARGET_SUFFIX: ${{ matrix.target.suffix }}
        run: python3 .release-tools/.github/scripts/pack-php-upx.py

      - name: Verify Linux JIT after UPX packing
        if: matrix.target.os == 'linux'
        run: python3 .release-tools/.github/jit/run_checks.py --php "$PWD/buildroot/bin/php" --expect-jit yes --output validation/jit-packed.json

      - name: Verify published micro coroutine behavior
        if: matrix.target.os == 'linux' && matrix.target.arch == 'x86_64' && matrix.target.suffix == ''
        run: python3 .release-tools/.github/jit/run_micro_checks.py --micro buildroot/bin/micro.sfx --output validation/micro-defaults.json

      - name: Verify and package
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php.version }}
          TARGET_OS: ${{ matrix.target.os }}
          TARGET_ARCH: ${{ matrix.target.arch }}
          TARGET_SUFFIX: ${{ matrix.target.suffix }}
        run: python3 .release-tools/.github/scripts/package-php.py

      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php.branch }}-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.suffix }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Build and run a real webman binary
        if: matrix.target.os == 'linux' && matrix.target.arch == 'x86_64' && matrix.target.suffix == ''
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php.version }}
          COMPARE_PUBLIC: ${{ inputs.validation-only }}
        run: python3 .release-tools/.github/scripts/smoke-webman-bin.py

      - uses: actions/upload-artifact@v4
        if: always() && matrix.target.os == 'linux' && matrix.target.arch == 'x86_64' && matrix.target.suffix == ''
        with:
          name: validation-php-${{ matrix.php.branch }}
          path: validation/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.php.branch }}-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.suffix }}
          path: log/
          retention-days: 7

  deploy:
    name: Publish verified binaries
    needs: [plan, build-release-artifacts]
    if: ${{ !inputs.validation-only }}
    uses: ./.github/workflows/deploy-php-unix.yml
    with:
      source-run-id: '${{ github.run_id }}'
      expected-packages: ${{ fromJSON(needs.plan.outputs.count) }}
    secrets:
      DEPLOY_SERVER_SECRET_KEY: ${{ secrets.DEPLOY_SERVER_SECRET_KEY }}
