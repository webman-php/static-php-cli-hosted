name: Publish static PHP

on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Build workflow run ID containing the verified php-* artifacts
        type: string
        required: true
      expected-packages:
        description: Expected number of packages in the selected build
        type: number
        default: 30
        required: true
      php-branch:
        description: PHP branch for a targeted build (leave blank for all branches)
        type: string
        default: ''
  workflow_call:
    inputs:
      source-run-id:
        type: string
        required: true
      expected-packages:
        type: number
        required: true
      php-branch:
        type: string
        default: ''
    secrets:
      DEPLOY_SERVER_SECRET_KEY:
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: static-php-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_PACKAGES: ${{ inputs.expected-packages }}
      PHP_BRANCH: ${{ inputs.php-branch }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_PACKAGES" =~ ^[0-9]+$ ]]
      - name: Configure restricted SSH deployment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SERVER_SECRET_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/php_deploy_key
          ssh-keygen -y -f ~/.ssh/php_deploy_key > ~/.ssh/php_deploy_key.pub
          echo 'Deployment public key (safe to authorize on the PHP upload endpoints):'
          cat ~/.ssh/php_deploy_key.pub
          ssh-keygen -lf ~/.ssh/php_deploy_key.pub
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source-run-id }}
          pattern: ${{ inputs.php-branch && format('php-{0}-*', inputs.php-branch) || 'php-*' }}
          path: release/
          merge-multiple: true
      - name: Verify all archives
        run: |
          set -euo pipefail
          test "$(find release -name '*.json' | wc -l)" -eq "$EXPECTED_PACKAGES"
          cd release
          for checksum in *.tar.gz.sha256; do sha256sum -c "$checksum"; done
      - name: Verify current PHP, no-intl and Linux UPX profiles
        run: python3 .github/scripts/verify-release-artifacts.py
      - name: Bundle verified files for the download server
        id: pull-bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-for-server-pull
          path: release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Publish through the PHP-only HTTPS pull endpoint
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pull-bundle.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.pull-bundle.outputs.artifact-digest }}
        run: python3 .github/scripts/pull-php-release.py
      - name: Verify public downloads
        run: python3 .github/scripts/verify-public-php.py
